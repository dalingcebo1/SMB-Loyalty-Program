repos:
  - repo: local
    hooks:
      - id: forbid-datetime-utcnow
        name: forbid datetime.utcnow usage
        entry: bash -c 'grep -R "datetime.utcnow(" Backend || true; files=$(grep -R "datetime.utcnow(" Backend | wc -l); [ "$files" -eq 0 ] || { echo "\nERROR: Found direct datetime.utcnow() usage. Use app.utils.time.utc_now() instead."; exit 1; }'
        language: system
        pass_filenames: false
        types: [python]
        stages: [commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.2
    hooks:
      - id: ruff
        args: ["--quiet"]
        additional_dependencies: []
      - id: ruff-format