name: "Backend: Deploy Dev (Azure Container Apps)"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "test/**"
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-deploy-dev.yml'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run Alembic upgrade head after deploy (true/false)"
        required: false
        default: 'true'
      health_retry_seconds:
        description: "Max seconds to wait for /health/ready=200"
        required: false
        default: '90'

env:
  AZURE_RESOURCE_GROUP: SMB-Loyalty-Group
  CONTAINERAPP_NAME: apismbloyaltyapp-dev
  ACR_NAME: smblpcontainerregistry
  IMAGE_NAME: smb-api

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dev dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r Backend/dev-requirements.txt

      - name: Run backend smoke tests (dev)
        run: |
          set -euo pipefail
          cd Backend
          DATABASE_URL=sqlite:///./dev.db pytest tests/test_health_endpoints.py tests/test_auth.py -q

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Build and push image to ACR (remote)
        run: |
          set -euo pipefail
          echo "Building $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} from Backend/Dockerfile (dev)"
          az acr build \
            -r "$ACR_NAME" \
            -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}-dev" \
            -f Backend/Dockerfile Backend

      - name: Deploy image & set env vars (dev)
        run: |
          set -euo pipefail

          # Resolve values from dev-specific secrets/variables, falling back to shared ones.
          res() { var="$1"; shift; for name in "$@"; do v="${!name:-}"; [ -n "$v" ] && { echo "$v"; return; }; done; echo ""; }

          export S_CA_DATABASE_URL_DEV='${{ secrets.CA_DATABASE_URL_DEV }}'
          export S_DATABASE_URL_DEV='${{ secrets.DATABASE_URL_DEV }}'
          export S_CA_DATABASE_URL='${{ secrets.CA_DATABASE_URL }}'
          export S_DATABASE_URL='${{ secrets.DATABASE_URL }}'

          export S_CA_ALLOWED_ORIGINS_DEV='${{ secrets.CA_ALLOWED_ORIGINS_DEV }}'
          export S_ALLOWED_ORIGINS_DEV='${{ secrets.ALLOWED_ORIGINS_DEV }}'
          export S_CA_ALLOWED_ORIGINS='${{ secrets.CA_ALLOWED_ORIGINS }}'
          export S_ALLOWED_ORIGINS='${{ secrets.ALLOWED_ORIGINS }}'

          export S_CA_FRONTEND_URL_DEV='${{ secrets.CA_FRONTEND_URL_DEV }}'
          export S_FRONTEND_URL_DEV='${{ secrets.FRONTEND_URL_DEV }}'
          export S_CA_FRONTEND_URL='${{ secrets.CA_FRONTEND_URL }}'
          export S_FRONTEND_URL='${{ secrets.FRONTEND_URL }}'

          export S_CA_JWT_SECRET_DEV='${{ secrets.CA_JWT_SECRET_DEV }}'
          export S_JWT_SECRET_DEV='${{ secrets.JWT_SECRET_DEV }}'
          export S_CA_JWT_SECRET='${{ secrets.CA_JWT_SECRET }}'
          export S_JWT_SECRET='${{ secrets.JWT_SECRET }}'

          export S_CA_RESET_SECRET_DEV='${{ secrets.CA_RESET_SECRET_DEV }}'
          export S_RESET_SECRET_DEV='${{ secrets.RESET_SECRET_DEV }}'
          export S_CA_RESET_SECRET='${{ secrets.CA_RESET_SECRET }}'
          export S_RESET_SECRET='${{ secrets.RESET_SECRET }}'

          export S_CA_SECRET_KEY_DEV='${{ secrets.CA_SECRET_KEY_DEV }}'
          export S_SECRET_KEY_DEV='${{ secrets.SECRET_KEY_DEV }}'
          export S_CA_SECRET_KEY='${{ secrets.CA_SECRET_KEY }}'
          export S_SECRET_KEY='${{ secrets.SECRET_KEY }}'

          export S_CA_SENTRY_DSN_DEV='${{ secrets.CA_SENTRY_DSN_DEV }}'
          export S_SENTRY_DSN_DEV='${{ secrets.SENTRY_DSN_DEV }}'
          export S_CA_SENTRY_DSN='${{ secrets.CA_SENTRY_DSN }}'
          export S_SENTRY_DSN='${{ secrets.SENTRY_DSN }}'

          export S_CA_DEFAULT_TENANT_DEV='${{ secrets.CA_DEFAULT_TENANT_DEV }}'
          export S_DEFAULT_TENANT_DEV='${{ secrets.DEFAULT_TENANT_DEV }}'
          export V_DEFAULT_TENANT_DEV='${{ vars.DEFAULT_TENANT_DEV }}'
          export S_CA_DEFAULT_TENANT='${{ secrets.CA_DEFAULT_TENANT }}'
          export S_DEFAULT_TENANT='${{ secrets.DEFAULT_TENANT }}'
          export V_DEFAULT_TENANT='${{ vars.DEFAULT_TENANT }}'

          RESOLVED_DATABASE_URL=$(res db S_CA_DATABASE_URL_DEV S_DATABASE_URL_DEV S_CA_DATABASE_URL S_DATABASE_URL)
          RESOLVED_ALLOWED_ORIGINS=$(res ao S_CA_ALLOWED_ORIGINS_DEV S_ALLOWED_ORIGINS_DEV S_CA_ALLOWED_ORIGINS S_ALLOWED_ORIGINS)
          RESOLVED_FRONTEND_URL=$(res fe S_CA_FRONTEND_URL_DEV S_FRONTEND_URL_DEV S_CA_FRONTEND_URL S_FRONTEND_URL)
          RESOLVED_JWT_SECRET=$(res js S_CA_JWT_SECRET_DEV S_JWT_SECRET_DEV S_CA_JWT_SECRET S_JWT_SECRET)
          RESOLVED_RESET_SECRET=$(res rs S_CA_RESET_SECRET_DEV S_RESET_SECRET_DEV S_CA_RESET_SECRET S_RESET_SECRET)
          RESOLVED_SECRET_KEY=$(res sk S_CA_SECRET_KEY_DEV S_SECRET_KEY_DEV S_CA_SECRET_KEY S_SECRET_KEY)
          RESOLVED_SENTRY_DSN=$(res sd S_CA_SENTRY_DSN_DEV S_SENTRY_DSN_DEV S_CA_SENTRY_DSN S_SENTRY_DSN)
          RESOLVED_DEFAULT_TENANT=$(res dt S_CA_DEFAULT_TENANT_DEV S_DEFAULT_TENANT_DEV V_DEFAULT_TENANT_DEV S_CA_DEFAULT_TENANT S_DEFAULT_TENANT V_DEFAULT_TENANT)
          if [ -z "$RESOLVED_DEFAULT_TENANT" ]; then RESOLVED_DEFAULT_TENANT="default"; fi

          echo "Diagnostics (dev) - set vs missing (values masked):"
          for k in RESOLVED_DATABASE_URL RESOLVED_ALLOWED_ORIGINS RESOLVED_FRONTEND_URL RESOLVED_SECRET_KEY RESOLVED_JWT_SECRET RESOLVED_RESET_SECRET RESOLVED_SENTRY_DSN RESOLVED_DEFAULT_TENANT; do
            if [ -n "${!k}" ]; then echo " - $k: set"; else echo " - $k: MISSING"; fi
          done

          secret_args=()
          [ -n "$RESOLVED_SECRET_KEY" ] && secret_args+=("secretkey-dev=$RESOLVED_SECRET_KEY")
          [ -n "$RESOLVED_JWT_SECRET" ] && secret_args+=("jwtsecretkey-dev=$RESOLVED_JWT_SECRET")
          [ -n "$RESOLVED_RESET_SECRET" ] && secret_args+=("resetsecretkey-dev=$RESOLVED_RESET_SECRET")

          if [ ${#secret_args[@]} -gt 0 ]; then
            echo "Updating Container App dev secrets"
            az containerapp secret set \
              -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
              --secrets "${secret_args[@]}"
          fi

          echo "Deploying dev image via az containerapp update"
          env_args=(
            "SECRET_KEY=secretref:secretkey-dev"
            "JWT_SECRET=secretref:jwtsecretkey-dev"
            "RESET_SECRET=secretref:resetsecretkey-dev"
            "ENVIRONMENT=dev"
          )
          [ -n "$RESOLVED_DATABASE_URL" ] && env_args+=( "DATABASE_URL=$RESOLVED_DATABASE_URL" )
          [ -n "$RESOLVED_ALLOWED_ORIGINS" ] && env_args+=( "ALLOWED_ORIGINS=$RESOLVED_ALLOWED_ORIGINS" )
          [ -n "$RESOLVED_FRONTEND_URL" ] && env_args+=( "FRONTEND_URL=$RESOLVED_FRONTEND_URL" )
          [ -n "$RESOLVED_SENTRY_DSN" ] && env_args+=( "SENTRY_DSN=$RESOLVED_SENTRY_DSN" )
          [ -n "$RESOLVED_DEFAULT_TENANT" ] && env_args+=( "DEFAULT_TENANT=$RESOLVED_DEFAULT_TENANT" )

          az containerapp update \
            -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
            --image "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}-dev" \
            --set-env-vars "${env_args[@]}"

      - name: Wait for dev revision ready & run health check
        run: |
          set -euo pipefail
          latest=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --query properties.latestRevisionName -o tsv)
          echo "Latest dev revision: $latest"

          timeout=${{ github.event.inputs.health_retry_seconds || '90' }}
          start=$SECONDS
          FQDN=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --query properties.configuration.ingress.fqdn -o tsv)

          while true; do
            code=$(curl -ks -o /dev/null -w '%{http_code}' "https://$FQDN/health/ready") || code=000
            echo "Health /health/ready -> $code"
            if [ "$code" = "200" ]; then
              echo "Dev health check passed"; break;
            fi
            if [ $((SECONDS-start)) -ge $timeout ]; then
              echo "Timed out waiting for dev /health/ready" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Optionally run Alembic migrations in dev
        if: github.event.inputs.run_migrations == 'true'
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Running Alembic upgrade head inside dev container ($FQDN)"
          az containerapp exec -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --command "cd /app && alembic -c alembic.ini upgrade head"
