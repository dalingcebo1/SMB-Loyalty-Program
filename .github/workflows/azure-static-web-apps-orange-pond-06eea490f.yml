name: Azure Static Web Apps CI/CD (Dev - Orange Pond)

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "test/**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
  workflow_dispatch:
    inputs:
      vite_api_base_url:
        description: "Optional override for VITE_API_BASE_URL (e.g., https://dev-api.example.com)"
        required: false
        type: string

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      actions: write
      contents: read
    env:
      API_BASE_FALLBACK: https://dev-loyalty-backend.mangoplant-11c2323f.southafricanorth.azurecontainerapps.io
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Upsert VITE_API_BASE_URL_DEV from manual input (no-op if empty)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.vite_api_base_url != ''
        uses: actions/github-script@v7
        env:
          VITE_API_BASE_URL_IN: ${{ github.event.inputs.vite_api_base_url }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const value = process.env.VITE_API_BASE_URL_IN;
            if (value && String(value).trim().length > 0) {
              core.info(`Setting repository variable VITE_API_BASE_URL_DEV=${value}`);
              await github.request('PUT /repos/{owner}/{repo}/actions/variables/{name}', {
                owner,
                repo,
                name: 'VITE_API_BASE_URL_DEV',
                value: String(value),
              });
            } else {
              core.info('No VITE_API_BASE_URL_DEV provided; skipping.');
            }

      - name: Sanity check build env (VITE_* presence)
        run: |
          echo "VITE_API_BASE_URL=${VITE_API_BASE_URL:+Set}"
          echo "VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-Missing}"
          echo "VITE_YOCO_PUBLIC_KEY=${VITE_YOCO_PUBLIC_KEY:+Set}"
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_DEV || secrets.CA_PUBLIC_API_URL_DEV || env.API_BASE_FALLBACK }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID_DEV || secrets.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID_DEV }}
          VITE_YOCO_PUBLIC_KEY: ${{ vars.VITE_YOCO_PUBLIC_KEY || secrets.VITE_YOCO_PUBLIC_KEY || vars.VITE_YOCO_PUBLIC_KEY_DEV || secrets.VITE_YOCO_PUBLIC_KEY_DEV }}

      - name: Write production env override for Vite
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::API base empty; Frontend/.env.production not updated.";
          else
            printf 'VITE_API_BASE_URL=%s\n' "$API_BASE_URL" > Frontend/.env.production
            echo "Pinned VITE_API_BASE_URL to $API_BASE_URL for this build.";
          fi
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL_DEV || secrets.CA_PUBLIC_API_URL_DEV || env.API_BASE_FALLBACK }}

      - name: Prefer npm – remove yarn.lock to avoid Yarn engine checks
        run: |
          rm -f Frontend/yarn.lock || true

      - name: Validate deployment prerequisites
        id: prereq
        run: |
          can_deploy=true
          if [ -z "${DEPLOY_TOKEN_PRIMARY}" ] && [ -z "${DEPLOY_TOKEN_FALLBACK}" ]; then
            echo "::warning::Missing Azure Static Web Apps deployment token for Orange Pond; build will run but deploy will be skipped.";
            can_deploy=false
          fi
          echo "can_deploy=${can_deploy}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_TOKEN_PRIMARY: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_POND_06EEA490F }}
          DEPLOY_TOKEN_FALLBACK: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}

      - name: Install Node dependencies (build only)
        if: steps.prereq.outputs.can_deploy != 'true'
        run: |
          cd Frontend
          npm ci

      - name: Build frontend (build only)
        if: steps.prereq.outputs.can_deploy != 'true'
        run: |
          cd Frontend
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_DEV || secrets.CA_PUBLIC_API_URL_DEV || env.API_BASE_FALLBACK }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY_DEV || secrets.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY_DEV }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN_DEV || secrets.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN_DEV }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID_DEV || secrets.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID_DEV }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET_DEV || secrets.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET_DEV }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID_DEV || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_DEV }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID_DEV || secrets.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID_DEV }}
          VITE_YOCO_PUBLIC_KEY: ${{ vars.VITE_YOCO_PUBLIC_KEY || vars.VITE_YOCO_PUBLIC_KEY_DEV || secrets.VITE_YOCO_PUBLIC_KEY || secrets.VITE_YOCO_PUBLIC_KEY_DEV }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Upload build artifact (build only)
        if: steps.prereq.outputs.can_deploy != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orange-pond-frontend-dist-${{ github.sha }}
          path: Frontend/dist
          if-no-files-found: error

      - name: Build And Deploy
        id: builddeploy
        if: steps.prereq.outputs.can_deploy == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_POND_06EEA490F || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./Frontend"
          output_location: "dist"
          app_build_command: |
            rm -f yarn.lock || true
            npm ci
            npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_DEV || secrets.CA_PUBLIC_API_URL_DEV || env.API_BASE_FALLBACK }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY_DEV || secrets.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY_DEV }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN_DEV || secrets.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN_DEV }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID_DEV || secrets.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID_DEV }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET_DEV || secrets.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET_DEV }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID_DEV || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_DEV }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID_DEV || secrets.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID_DEV }}
          VITE_YOCO_PUBLIC_KEY: ${{ vars.VITE_YOCO_PUBLIC_KEY || vars.VITE_YOCO_PUBLIC_KEY_DEV || secrets.VITE_YOCO_PUBLIC_KEY || secrets.VITE_YOCO_PUBLIC_KEY_DEV }}
          USE_NPM: "true"
          NODE_VERSION: "20"
          WEBSITE_NODE_DEFAULT_VERSION: "~20"
          SWA_NODE_VERSION: "20"
          VITE_APP_VERSION: ${{ github.sha }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && (secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_POND_06EEA490F || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV)
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_POND_06EEA490F || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          app_location: "./Frontend"
          output_location: "dist"
          action: "close"
