name: OpenAPI Diff (PR)

on:
  pull_request:
    paths:
      - 'Backend/**'
      - '!Backend/tests/openapi_snapshot.json'
      - '.github/workflows/openapi-diff-pr.yml'

jobs:
  openapi-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Generate current OpenAPI spec
        run: |
          cd Backend
          PYTHONPATH=. python scripts/dump_openapi.py > ../_current_openapi.json

      - name: Diff against snapshot
        id: diff
        run: |
          if [ ! -f Backend/tests/openapi_snapshot.json ]; then
            echo 'Snapshot file missing'; exit 1; fi
          diff -u Backend/tests/openapi_snapshot.json _current_openapi.json > openapi.diff || true
          if [ -s openapi.diff ]; then
            echo 'has_diff=true' >> $GITHUB_OUTPUT
          else
            echo 'has_diff=false' >> $GITHUB_OUTPUT
          fi

      - name: Comment diff on PR (if changed)
        if: steps.diff.outputs.has_diff == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('openapi.diff', 'utf8');
            const body = `⚠️ OpenAPI diff detected (snapshot vs generated)\n\n<details><summary>Unified Diff</summary>\n\n\n
${diff.replace(/`/g,'\\`')}\n\n</details>\n\nIf intentional, update snapshot via: \n\n\`make snapshot-openapi\` then commit the updated \`Backend/tests/openapi_snapshot.json\`.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Fail if diff and not allowed
        if: steps.diff.outputs.has_diff == 'true' && !contains(github.event.pull_request.body, 'ALLOW_NEW_ENDPOINTS=1')
        run: |
          echo 'OpenAPI changes detected. Update snapshot or add ALLOW_NEW_ENDPOINTS=1 to PR description temporarily.'
          exit 1